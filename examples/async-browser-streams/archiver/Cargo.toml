[package]
name = "archiver"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# `async` brings in the component-model `stream`/`future` runtime support;
# `async-spawn` provides `wit_bindgen::spawn`, which the `archive` export uses to
# run the tar producer as a detached task while it returns the compressor's
# gzip stream.
wit-bindgen = { version = "0.57", features = ["async", "async-spawn"] }
# `tar-core` builds the 512-byte `ustar` headers (and computes their checksums)
# so this component doesn't hand-roll tar's octal field encoding. Its default
# `std` feature enables the `builder` module; `std` on `wasm32-unknown-unknown`
# pulls in no `wasi:*` imports.
tar-core = "0.1"
