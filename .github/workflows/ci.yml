name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Installs the same toolchain (and version pins) as the dev container and
      # the Copilot cloud agent, via scripts/install-tools.sh.
      - name: Set up Component Model toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Run CI checks
        run: just ci
